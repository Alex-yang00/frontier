name: collect-medium
on:
  schedule: [{ cron: '0 */6 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency:
  group: forager-data-pipeline
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: pip install -r requirements.txt
      - name: Restore current data branch
        run: |
          mkdir -p /tmp/forager-data /tmp/forager-data-seed
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git archive origin/data data | tar -x -C /tmp/forager-data-seed
            cp -R /tmp/forager-data-seed/data/. /tmp/forager-data/
          fi
      - run: python -m scripts.aggregate --group medium --output /tmp/forager-data
      - run: python -m scripts.enrich --limit 80 --batch-size 16 /tmp/forager-data/medium.json /tmp/forager-data/daily.json
        env:
          FORAGER_TRANSLATION_ENDPOINT: ${{ secrets.FORAGER_TRANSLATION_ENDPOINT }}
          FORAGER_TRANSLATION_API_KEY: ${{ secrets.FORAGER_TRANSLATION_API_KEY }}
          FORAGER_TRANSLATION_MODEL: ${{ secrets.FORAGER_TRANSLATION_MODEL }}
      - run: python -m scripts.translate --batch-size 24 /tmp/forager-data/medium.json /tmp/forager-data/daily.json
        env:
          FORAGER_TRANSLATION_ENDPOINT: ${{ secrets.FORAGER_TRANSLATION_ENDPOINT }}
          FORAGER_TRANSLATION_API_KEY: ${{ secrets.FORAGER_TRANSLATION_API_KEY }}
          FORAGER_TRANSLATION_MODEL: ${{ secrets.FORAGER_TRANSLATION_MODEL }}
      - run: |
          git config user.name forager-bot
          git config user.email forager-bot@users.noreply.github.com
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then git switch -C data origin/data; else git switch --orphan data && git rm -rf . 2>/dev/null || true; fi
          mkdir -p data
          rsync -a --delete /tmp/forager-data/ data/
          git add data
          git diff --cached --quiet || git commit -m "data: medium $(date -u +%FT%TZ)"
          git push --set-upstream origin data
      - name: Publish current JSON to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare credentials missing; data branch was updated but R2 was not."
            exit 0
          fi
          npx --yes wrangler@4.124.0 r2 object put forager-data/daily.json --file=/tmp/forager-data/daily.json --remote
          npx --yes wrangler@4.124.0 r2 object put forager-data/medium.json --file=/tmp/forager-data/medium.json --remote
          npx --yes wrangler@4.124.0 r2 object put forager-data/meta.json --file=/tmp/forager-data/meta.json --remote
          npx --yes wrangler@4.124.0 r2 object put forager-data/weeks.json --file=/tmp/forager-data/weeks.json --remote
