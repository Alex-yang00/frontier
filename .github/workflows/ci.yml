name: ci
# workflow_dispatch so the suite can be run on demand rather than only by pushing.
# This workflow was disabled manually on 2026-08-14 and re-enabled 2026-08-23; with
# no manual trigger there was no way to check it was green before relying on it.
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python -m compileall core collectors cli scripts
      - run: pytest -q
      # The data is fetched, not checked out: web/public/data/ is gitignored, so a
      # fresh checkout has no daily.json and this step exited 1 with "does not
      # exist" on run 32629722966 -- it had never run against anything.
      #
      # --warn-only because this measures live data on a code push. A thin day is
      # not a broken commit, so the numbers are printed for the record and only the
      # collect workflows gate on them.
      - name: Audit the live data snapshot (report only)
        run: |
          git fetch origin data --depth 1
          mkdir -p /tmp/ci-data
          git archive FETCH_HEAD data | tar -x --strip-components=1 -C /tmp/ci-data
          python -m scripts.audit /tmp/ci-data --warn-only
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.0 }
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
