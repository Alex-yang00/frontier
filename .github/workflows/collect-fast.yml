name: collect-fast
on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency:
  group: frontier-data-pipeline
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: pip install -r requirements.txt
      - name: Restore current data branch
        run: |
          mkdir -p /tmp/frontier-data /tmp/frontier-data-seed
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git archive origin/data data | tar -x -C /tmp/frontier-data-seed
            cp -R /tmp/frontier-data-seed/data/. /tmp/frontier-data/
          fi
      - run: python -m scripts.aggregate --group fast --output /tmp/frontier-data
      # Enrich runs here, not only in collect-medium, because a row without a
      # rewritten summary and headline does not render as a finished story. Medium
      # runs every 6 hours, so an item collected at 06:10 UTC waited until 12:00 for
      # one: measured 2026-08-23, the newest day held 7 tech articles of which 1 was
      # presentable, which is what made the homepage open on the previous day. A
      # 30-minute cadence is what keeps today's page current.
      #
      # Throughlines are skipped: the section briefing is day-level prose that does
      # not change per half-hour, and collect-medium and collect-slow still write it.
      # Budgets are sized against this job's 20 min: setup ~1 + aggregate 0.2 +
      # enrich 5 + translate 9.2 = 15.4.
      - run: python -m scripts.enrich --limit 24 --batch-size 8 --skip-throughlines /tmp/frontier-data/daily.json /tmp/frontier-data/hot.json
        env:
          FRONTIER_ENRICH_BUDGET_SECONDS: '300'
          FRONTIER_TRANSLATION_ENDPOINT: ${{ secrets.FRONTIER_TRANSLATION_ENDPOINT }}
          FRONTIER_TRANSLATION_API_KEY: ${{ secrets.FRONTIER_TRANSLATION_API_KEY }}
          FRONTIER_TRANSLATION_MODEL: ${{ secrets.FRONTIER_TRANSLATION_MODEL }}
          FRONTIER_LLM_RETRIES: '1'
      # Translate latency is per-request and nearly flat in batch size (measured
      # on real runs: 38s worst case at 4/batch, same at 12/batch), so batch size
      # -- not --limit -- sets the wall clock. batch=4 was forced by a timeout
      # from pre-clipping 38k-char payloads; with SOURCE_CLIP a 12-item batch
      # ships 5.9 KiB. Raising it cuts requests 3x, which paid for the higher
      # limit the filter-before-slice fix made meaningful (before it, a run
      # advanced nothing). Projected worst case below, against the timeout above.
      # Projected: 9.2 of 20 min.
      - run: python -m scripts.translate --limit 40 --batch-size 12 /tmp/frontier-data/daily.json /tmp/frontier-data/hot.json
        env:
          FRONTIER_TRANSLATION_ENDPOINT: ${{ secrets.FRONTIER_TRANSLATION_ENDPOINT }}
          FRONTIER_TRANSLATION_API_KEY: ${{ secrets.FRONTIER_TRANSLATION_API_KEY }}
          FRONTIER_TRANSLATION_MODEL: ${{ secrets.FRONTIER_TRANSLATION_MODEL }}
          FRONTIER_LLM_RETRIES: '1'
      - run: |
          git config user.name frontier-bot
          git config user.email frontier-bot@users.noreply.github.com
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then git switch -C data origin/data; else git switch --orphan data && git rm -rf . 2>/dev/null || true; fi
          mkdir -p data
          rsync -a --delete /tmp/frontier-data/ data/
          git add data
          git diff --cached --quiet || git commit -m "data: fast $(date -u +%FT%TZ)"
          git push --set-upstream origin data
      - name: Publish current JSON to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare credentials missing; data branch was updated but R2 was not."
            exit 0
          fi
          npx --yes wrangler@4.124.0 r2 object put frontier-data/daily.json --file=/tmp/frontier-data/daily.json --remote
          npx --yes wrangler@4.124.0 r2 object put frontier-data/hot.json --file=/tmp/frontier-data/hot.json --remote
          npx --yes wrangler@4.124.0 r2 object put frontier-data/meta.json --file=/tmp/frontier-data/meta.json --remote
          npx --yes wrangler@4.124.0 r2 object put frontier-data/weeks.json --file=/tmp/frontier-data/weeks.json --remote
      # Last, so a quality failure reports without discarding the run: the data is
      # already committed and published by this point. Failing the job is what makes
      # a bad day visible instead of silently shipping to the homepage.
      - name: Audit what this run published
        run: python -m scripts.audit /tmp/frontier-data
