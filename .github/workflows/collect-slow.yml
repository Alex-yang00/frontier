name: collect-slow
on:
  schedule: [{ cron: '30 1 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency:
  group: frontier-data-pipeline
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: pip install -r requirements.txt
      - name: Restore current data branch
        run: |
          mkdir -p /tmp/frontier-data /tmp/frontier-data-seed
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git archive origin/data data | tar -x -C /tmp/frontier-data-seed
            cp -R /tmp/frontier-data-seed/data/. /tmp/frontier-data/
          fi
      - run: python -m scripts.aggregate --group slow --output /tmp/frontier-data
        env:
          FRONTIER_YOUTUBE_API_KEY: ${{ secrets.FRONTIER_YOUTUBE_API_KEY }}
      # See collect-medium for the batch-size and budget derivation. Lower limit
      # and tighter budgets here because this job also runs the weekly rollup.
      # Against 30 min, same in-flight accounting as collect-medium:
      # 0.5 + (enrich 10 + 3) + (translate 8 + 2) + rollup/publish 1 = 24.5.
      # --limit 32 keeps the classify loop inside its 60% share of the smaller
      # budget here (8 requests over two files, ~5.6 min against 7.2).
      - run: python -m scripts.enrich --limit 32 --batch-size 8 /tmp/frontier-data/daily.json /tmp/frontier-data/slow.json
        env:
          FRONTIER_ENRICH_BUDGET_SECONDS: '600'
          FRONTIER_TRANSLATION_ENDPOINT: ${{ secrets.FRONTIER_TRANSLATION_ENDPOINT }}
          FRONTIER_TRANSLATION_API_KEY: ${{ secrets.FRONTIER_TRANSLATION_API_KEY }}
          FRONTIER_TRANSLATION_MODEL: ${{ secrets.FRONTIER_TRANSLATION_MODEL }}
          FRONTIER_LLM_RETRIES: '1'
      # Translate latency is per-request and nearly flat in batch size (measured
      # on real runs: 38s worst case at 4/batch, same at 12/batch), so batch size
      # -- not --limit -- sets the wall clock. batch=4 was forced by a timeout
      # from pre-clipping 38k-char payloads; with SOURCE_CLIP a 12-item batch
      # ships 5.9 KiB. Raising it cuts requests 3x, which paid for the higher
      # limit the filter-before-slice fix made meaningful (before it, a run
      # advanced nothing). Projected worst case below, against the timeout above.
      # Projected: 13.8 of 30 min.
      - run: |
          python -m scripts.translate --limit 60 --batch-size 12 /tmp/frontier-data/daily.json /tmp/frontier-data/slow.json
          mkdir -p /tmp/frontier-data/archive
          cp /tmp/frontier-data/daily.json /tmp/frontier-data/archive/$(date -u +%F).json
        env:
          FRONTIER_TRANSLATE_BUDGET_SECONDS: '480'
          FRONTIER_TRANSLATION_ENDPOINT: ${{ secrets.FRONTIER_TRANSLATION_ENDPOINT }}
          FRONTIER_TRANSLATION_API_KEY: ${{ secrets.FRONTIER_TRANSLATION_API_KEY }}
          FRONTIER_TRANSLATION_MODEL: ${{ secrets.FRONTIER_TRANSLATION_MODEL }}
          FRONTIER_LLM_RETRIES: '1'
      - run: |
          git config user.name frontier-bot
          git config user.email frontier-bot@users.noreply.github.com
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then git switch -C data origin/data; else git switch --orphan data && git rm -rf . 2>/dev/null || true; fi
          mkdir -p data
          rsync -a --delete /tmp/frontier-data/ data/
          git add data
          git diff --cached --quiet || git commit -m "data: slow $(date -u +%FT%TZ)"
          git push --set-upstream origin data
      - name: Publish current JSON to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare credentials missing; data branch was updated but R2 was not."
            exit 0
          fi
          archive="archive/$(date -u +%F).json"
          npx --yes wrangler@4.124.0 r2 object put frontier-data/daily.json --file=/tmp/frontier-data/daily.json --remote
          npx --yes wrangler@4.124.0 r2 object put frontier-data/slow.json --file=/tmp/frontier-data/slow.json --remote
          npx --yes wrangler@4.124.0 r2 object put frontier-data/meta.json --file=/tmp/frontier-data/meta.json --remote
          npx --yes wrangler@4.124.0 r2 object put frontier-data/weeks.json --file=/tmp/frontier-data/weeks.json --remote
          npx --yes wrangler@4.124.0 r2 object put "frontier-data/$archive" --file="/tmp/frontier-data/$archive" --remote
