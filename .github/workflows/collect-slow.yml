name: collect-slow
on:
  schedule: [{ cron: '30 1 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: mkdir -p /tmp/forager-data && python -m scripts.aggregate --group slow --output /tmp/forager-data
      - run: python -m scripts.enrich --limit 120 /tmp/forager-data/daily.json
        env:
          FORAGER_TRANSLATION_ENDPOINT: ${{ secrets.FORAGER_TRANSLATION_ENDPOINT }}
          FORAGER_TRANSLATION_API_KEY: ${{ secrets.FORAGER_TRANSLATION_API_KEY }}
          FORAGER_TRANSLATION_MODEL: ${{ secrets.FORAGER_TRANSLATION_MODEL }}
      - run: python -m scripts.translate /tmp/forager-data/daily.json /tmp/forager-data/archive/$(date -u +%F).json
        env:
          FORAGER_TRANSLATION_ENDPOINT: ${{ secrets.FORAGER_TRANSLATION_ENDPOINT }}
          FORAGER_TRANSLATION_API_KEY: ${{ secrets.FORAGER_TRANSLATION_API_KEY }}
          FORAGER_TRANSLATION_MODEL: ${{ secrets.FORAGER_TRANSLATION_MODEL }}
      - run: |
          git config user.name forager-bot
          git config user.email forager-bot@users.noreply.github.com
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then git switch -C data origin/data; else git switch --orphan data && git rm -rf . 2>/dev/null || true; fi
          mkdir -p data
          cp -R /tmp/forager-data/. data/
          git add data
          git diff --cached --quiet || git commit -m "data: slow $(date -u +%FT%TZ)"
          git push
