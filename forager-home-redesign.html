<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forager — 首页版式改版稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.962 0.003 265);
  --surface:oklch(0.995 0.001 265);
  --raise:oklch(0.975 0.003 265);
  --fg:oklch(0.185 0.008 265);
  /* 0.506, not 0.515: at 0.515 the meta text on a pressed day button measured
     4.33:1 and missed the 4.5 floor for 11-12px text. */
  --muted:oklch(0.506 0.012 265);
  --border:oklch(0.893 0.005 265);
  /* control boundaries (inputs, buttons) need 3:1 per WCAG 1.4.11; --border is
     1.36:1 and is correct only for decorative hairlines between rows. */
  --border-strong:oklch(0.590 0.006 265);
  --rule:oklch(0.28 0.010 265);
  --accent:oklch(0.475 0.135 150);
  --accent-soft:oklch(0.475 0.135 150 / 0.10);
  --hov:oklch(0.938 0.004 265);
  --hov-2:oklch(0.912 0.005 265);

  --font-display:"Newsreader",Georgia,"Songti SC","Noto Serif SC",serif;
  --font-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,"PingFang SC",monospace;

  /* Latin metrics. Overridden for CJK below — this is the fix for the collapsed leading. */
  --lh-display:1.06;
  --lh-lead:1.18;
  --lh-head:1.24;
  --lh-body:1.6;
  --tr-display:-0.022em;
  --tr-head:-0.012em;
}
html[lang^="zh"]{
  --lh-display:1.34;
  --lh-lead:1.38;
  --lh-head:1.44;
  --lh-body:1.78;
  --tr-display:0;
  --tr-head:0;
}
html[data-theme="dark"]{
  --bg:oklch(0.152 0.004 265);
  --surface:oklch(0.196 0.005 265);
  --raise:oklch(0.232 0.006 265);
  --fg:oklch(0.945 0.003 265);
  --muted:oklch(0.672 0.012 265);
  --border:oklch(0.312 0.008 265);
  --border-strong:oklch(0.555 0.008 265);
  --rule:oklch(0.74 0.010 265);
  --accent:oklch(0.775 0.145 152);
  --accent-soft:oklch(0.775 0.145 152 / 0.14);
  --hov:oklch(0.238 0.006 265);
  --hov-2:oklch(0.272 0.007 265);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--font-sans);font-size:16.5px;line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* skip link: the section bar plus day strip is ~14 tab stops before the first
   headline. Visible only on focus, and it must sit above the sticky bars. */
.skip{position:fixed;top:-100px;left:12px;z-index:60;
  font-family:var(--font-mono);font-size:12.5px;
  background:var(--surface);color:var(--fg);
  border:1px solid var(--border-strong);border-radius:2px;padding:9px 14px;
  transition:top .14s}
.skip:focus{top:12px}

/* metadata: monospace carries the signal, no uppercase shouting */
.meta{
  font-family:var(--font-mono);font-size:12px;line-height:1.5;
  letter-spacing:0.01em;color:var(--muted);font-variant-numeric:tabular-nums;
}
.rail-label{font-family:var(--font-mono);font-size:11px;letter-spacing:0.055em;color:var(--muted)}

/* shell — two columns. Sections moved to a horizontal bar under the masthead,
   the way a newspaper runs them, so the whole left column goes back to the text.
   864 + 316 = 1180 = max-width: tracks fill the shell, no dead background. */
.shell{max-width:1180px;margin:0 auto;
  display:grid;grid-template-columns:minmax(0,1fr) 316px}
.rail-r{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;
  padding:22px 0;background:var(--bg);border-left:1px solid var(--border)}
.paper{background:var(--surface);min-height:100dvh;
  border-left:1px solid var(--border);border-right:1px solid var(--border)}

.wordmark-txt{font-family:var(--font-display);font-size:25px;letter-spacing:-0.015em}
.mark{width:30px;height:30px;flex-shrink:0}

.rail-scroll{flex:1;overflow-y:auto;scrollbar-width:thin}
.rail-label.pad{display:block;padding:0 20px 8px}

/* section bar — one axis for switching, sits on the masthead's heavy rule */
.secbar{position:sticky;top:0;z-index:20;display:flex;align-items:stretch;
  padding:0 44px;background:var(--surface);
  border-top:2px solid var(--rule);border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none}
.secbar::-webkit-scrollbar{display:none}
.sitem{display:flex;align-items:baseline;gap:7px;flex-shrink:0;
  padding:12px 0 10px;margin-right:28px;margin-bottom:-1px;
  border-bottom:2px solid transparent;color:var(--muted);
  transition:color .16s,border-color .16s}
.sitem:last-child{margin-right:0}
.sitem:hover{color:var(--fg)}
.sitem[aria-current="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.sitem-n{font-family:var(--font-display);font-size:19px;line-height:1.15;
  letter-spacing:var(--tr-head)}
.sitem[aria-current="true"] .sitem-n{font-weight:500}
.sitem-c{font-family:var(--font-mono);font-size:11.5px;font-variant-numeric:tabular-nums}

/* this-issue day strip — real filter, not decoration */
.rail-block{padding:0 20px 20px}
.rail-block .rail-label.pad{padding:0 0 8px}
.days{display:flex;flex-direction:column;gap:1px}
/* was opacity:.6 on --fg, which composited to 2.26:1 in light theme — below the
   4.5 floor for 11px text. --muted is a solved token (4.50:1 on --hov-2, the
   worst background a day row can have). */
.day-dt{color:var(--muted)}
/* 24px is the WCAG 2.2 AA target-size minimum (SC 2.5.8); a 7-row day strip at
   the 44px AAA figure would be 308px of rail for a secondary filter. */
.day{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  width:100%;min-height:26px;padding:7px 6px;border-radius:2px;
  transition:background-color .16s}
.day:not(:disabled):hover{background:var(--hov)}
.day[aria-pressed="true"]{background:var(--hov-2)}
.day:disabled{cursor:default;opacity:.42}
.day-d{font-family:var(--font-mono);font-size:12.5px;letter-spacing:0.01em}
.day[aria-pressed="true"] .day-d{font-weight:500}
.day-n{font-family:var(--font-mono);font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums}
/* active filter bar — the visible link between rail and centre */
.fbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  padding:11px 44px;border-bottom:1px solid var(--border);background:var(--raise)}
.fchip{display:inline-flex;align-items:center;gap:6px;
  font-family:var(--font-mono);font-size:12px;min-height:26px;
  border:1px solid var(--fg);border-radius:2px;padding:4px 9px;
  transition:background-color .16s}
.fchip:hover{background:var(--hov-2)}
.fchip:active{background:var(--hov-2);transform:translateY(0.5px)}
.fchip svg{width:11px;height:11px}
.fclear{margin-left:auto;font-family:var(--font-mono);font-size:12px;
  color:var(--muted);padding:6px 0;margin-block:-6px;transition:color .16s}
.fclear:hover{color:var(--fg)}

/* ---- masthead: the one heavy rule in the whole design ----
   Compressed: 54px name -> 44px, tagline dropped, padding tightened.
   A returning reader does not need the brand restated at full height every
   visit; what they came for is the first headline. ~62px saved, which is most
   of a standard item row. */
.masthead{padding:22px 44px 18px}
.mh-top{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-bottom:14px}
/* the mark lives here now that the left rail is gone — centred, between the two
   mono lines, so the masthead still carries the brand without a whole column */
.mh-mark{width:24px;height:24px;flex-shrink:0;color:var(--fg)}
.mh-top .mh-kicker{flex:1}
.mh-top #mh-issue{text-align:right}
.mh-kicker{font-family:var(--font-mono);font-size:11px;color:var(--muted);
  letter-spacing:0.055em}
html[lang^="en"] .mh-kicker{text-transform:uppercase;letter-spacing:0.085em}
.mh-name{font-family:var(--font-display);font-size:44px;line-height:var(--lh-display);
  letter-spacing:var(--tr-display);text-align:center;display:block}
/* section head — names the section and its deck, below the switcher */
.sec{display:flex;align-items:baseline;gap:12px;padding:15px 44px 0}
.sec-h{font-family:var(--font-display);font-size:21px;line-height:var(--lh-head);
  letter-spacing:var(--tr-head)}
.sec-n{font-family:var(--font-mono);font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.sec-note{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}

.feed{padding:4px 0 0}

/* ---- tier 1: lead ---- */
.it{display:block;border-bottom:1px solid var(--border);transition:background-color .16s}
.it:hover{background:var(--hov)}
/* the headline is the link; the row is the hit area it visually owns */
.it-a{display:block;color:inherit;text-decoration:none}
.it-a::after{content:"";position:absolute;inset:0}
.it{position:relative}
/* focus ring tracks the row, not just the text line */
.it:focus-within{background:var(--hov)}
.it-a:focus-visible{outline:none}
.it:focus-within::before{content:"";position:absolute;inset:2px;pointer-events:none;
  outline:2px solid var(--accent);outline-offset:0;border-radius:2px}
/* tier spacing is now ~2x between steps (28/30 : 13/14 : 10), not 1.5x —
   at 1.5x the tiers read as one grey field */
.lead{padding:28px 44px 30px;display:grid;grid-template-columns:66px minmax(0,1fr);gap:0 18px}
.ord{font-family:var(--font-display);font-size:42px;line-height:1;color:var(--muted);
  font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.lead-h{font-family:var(--font-display);font-size:30px;line-height:var(--lh-lead);
  letter-spacing:var(--tr-head);margin:6px 0 0;font-weight:400;
  transition:color .16s;text-wrap:balance}
.it:hover .lead-h{color:var(--accent)}
/* pretty, not balance: a deck is 2-3 lines of body copy, so the goal is no
   orphan on the last line, not equal line lengths. */
.lead-deck{font-size:16.5px;line-height:var(--lh-body);color:var(--muted);
  margin-top:11px;max-width:62ch;text-wrap:pretty}
.lead-foot{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin-top:14px;
  position:relative;z-index:1}

/* tags: no border. A box now means exactly one thing on this page — a filter
   you can click off (.fchip). Tags are entry points, so they read as text. */
.tags{display:flex;flex-wrap:wrap;gap:4px 13px}
/* 11.5px mono text is a ~14px tall target. Vertical padding takes it to 24px
   (WCAG 2.2 AA, SC 2.5.8) without adding a visible box, and the negative margin
   keeps the row's optical spacing unchanged. */
.tag{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);
  padding:5px 0;margin:-5px 0;transition:color .16s}
.tag:hover{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.tag:active{color:var(--fg)}
.tag.is-on{color:var(--fg);font-weight:500;text-decoration:underline;
  text-underline-offset:3px;text-decoration-thickness:1.5px}

/* ---- tier 2: standard ---- */
.std{display:block;padding:13px 44px 14px}
.std-h{font-family:var(--font-display);font-size:19.5px;line-height:var(--lh-head);
  letter-spacing:var(--tr-head);font-weight:400;transition:color .16s}
.it:hover .std-h{color:var(--accent)}
.std-m{margin-top:5px}

/* ---- tier 3: brief — sans, tight, scannable ----
   No rule between briefs: a newspaper draws lines between columns, not between
   every line inside one. Spacing separates them; the count of rules per screen
   drops from ~12 to ~4 and the block reads as one denser object. */
.it.is-brf{border-bottom:none}
.it.is-brf:last-child{border-bottom:1px solid var(--border)}
.brf{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;
  gap:6px 16px;padding:10px 44px}
.brf-h{font-size:15px;font-weight:500;line-height:1.5;transition:color .16s}
html[lang^="zh"] .brf-h{line-height:1.65}
.it:hover .brf-h{color:var(--accent)}
.brf-m{white-space:nowrap}
.brief-head{display:flex;align-items:center;gap:10px;padding:20px 44px 7px}
.brief-head .rail-label{white-space:nowrap}
.brief-head .hr{flex:1;height:1px;background:var(--border)}

.empty{padding:56px 44px;text-align:center}
.empty-t{font-family:var(--font-display);font-size:20px;line-height:var(--lh-head)}
.empty-d{font-size:14.5px;color:var(--muted);margin-top:6px}
.empty-b{margin-top:16px;font-family:var(--font-mono);font-size:12.5px;
  min-height:40px;border:1px solid var(--border-strong);border-radius:2px;
  padding:9px 16px;transition:background-color .16s,border-color .16s}
.empty-b:hover{background:var(--hov-2);border-color:var(--fg)}
.empty-b:active{background:var(--hov-2);transform:translateY(0.5px)}

/* loading: same row rhythm and gutters as .std, so the feed does not jump when
   the real items replace it */
.skel-it{padding:13px 44px 14px;border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;gap:8px}
.skel-l{display:block;height:11px;border-radius:2px;background:var(--hov-2);
  animation:pulse 1.5s ease-in-out infinite}
.skel-h1{height:17px;width:88%}
.skel-it:nth-child(2) .skel-l{animation-delay:.12s}
.skel-it:nth-child(3) .skel-l{animation-delay:.24s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

.paper-foot{padding:20px 44px 60px;border-top:1px solid var(--border);
  display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}

/* ---- right rail ---- */
.tools{display:flex;justify-content:flex-end;gap:7px;padding:0 20px 16px;
  border-bottom:1px solid var(--border);margin-bottom:16px}
/* 40px, not 34px: 34 clears the 24px AA target minimum but is tight for touch.
   --border-strong, not --border: this is a control boundary, so WCAG 1.4.11
   applies (3:1); --border is 1.36:1 and belongs only on decorative row rules. */
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:40px;min-width:40px;padding:0 11px;
  border:1px solid var(--border-strong);border-radius:2px;
  color:var(--muted);transition:background-color .16s,border-color .16s,color .16s}
.tbtn:hover{background:var(--hov-2);border-color:var(--fg);color:var(--fg)}
.tbtn:active{background:var(--hov-2);transform:translateY(0.5px)}
.tbtn[aria-expanded="true"]{background:var(--hov-2);border-color:var(--fg);color:var(--fg)}
.tbtn svg{width:16px;height:16px}
.tbtn-lab{font-family:var(--font-mono);font-size:11.5px;letter-spacing:0.02em}

.srch{position:relative;padding:0 20px 20px}
.srch svg{position:absolute;left:31px;top:12px;width:15px;height:15px;color:var(--muted);
  pointer-events:none}
.srch input{width:100%;height:40px;padding:0 11px 0 32px;
  background:var(--surface);color:var(--fg);
  border:1px solid var(--border-strong);border-radius:2px;
  font-family:var(--font-sans);font-size:14px;transition:border-color .16s}
.srch input::placeholder{color:var(--muted)}
.srch input:hover{border-color:var(--fg)}
/* 2px ring, not a border swap: a 1px colour change is a ~1.5:1 delta against the
   resting border and fails 1.4.11's non-text contrast for focus indication. */
.srch input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;
  border-color:var(--accent)}

/* ---- right rail: what the centre cannot show ----
   Two earlier versions of this rail were duplicates of something already on the
   page: first a contents list of the same headlines, then an "other sections"
   list that repeated the section bar. What is left is the one thing neither the
   centre nor the section bar can express — why this section's items hang
   together. If the generated text is ever missing, hide the block; do not fall
   back to placeholder prose. */
.idx{padding:0 20px}
.idx-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding-bottom:9px;border-bottom:1px solid var(--border)}
.idx-h{font-family:var(--font-display);font-size:16.5px;line-height:var(--lh-head)}
.thru{font-family:var(--font-display);font-size:15.5px;line-height:1.62;
  padding:11px 0 14px;text-wrap:pretty}
html[lang^="zh"] .thru{line-height:1.85}
.thru em{font-style:normal;box-shadow:inset 0 -0.42em 0 var(--accent-soft)}
/* no bottom border: it used to divide this from the "other sections" list below.
   With nothing below it, a rule would just hang in empty rail. */
.thru-sig{display:block;font-family:var(--font-mono);font-size:11px;color:var(--muted);
  letter-spacing:0.03em}

.langmenu{position:relative}
.langpop{position:absolute;right:0;top:calc(100% + 5px);z-index:40;min-width:132px;
  background:var(--surface);border:1px solid var(--fg);border-radius:2px;
  box-shadow:0 8px 24px oklch(0 0 0 / 0.13);padding:3px}
.langpop[hidden]{display:none}
.langpop button{display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;padding:7px 9px;font-size:13.5px;border-radius:2px;transition:background-color .16s}
.langpop button:hover{background:var(--hov-2)}
.langpop svg{width:14px;height:14px;color:var(--accent)}


/* mobile chrome — hidden on desktop */
.mtop,.m-idx,.m-thru,.msrch{display:none}

/* ---- right rail folds under the feed ---- */
@media (max-width:1180px){
  .shell{max-width:864px;grid-template-columns:minmax(0,1fr)}
  .rail-r{display:none}
  /* throughline above the feed, reading as the section's lede */
  .m-thru{display:block;padding:4px 44px 18px;border-bottom:1px solid var(--border)}
  .m-thru .idx{padding:0}
  .m-thru .idx-head{border-bottom:none;padding-bottom:4px}
  /* wider column than the 316px rail, so it can afford a longer measure */
  .m-thru .thru{font-size:16.5px;max-width:64ch;padding:6px 0 10px}
  .m-idx{display:block;border-top:1px solid var(--border);padding:22px 44px 0}
  .m-idx .rail-block{padding:0 0 18px}
  .m-idx .rail-label{display:block;padding-bottom:8px}
  /* two-up day strip below the feed — the vertical list is a rail shape, not a page shape */
  .m-idx .days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px 8px}
  .paper{border-right:none}

  /* The top bar has to appear at the SAME breakpoint the rail leaves, not at 880.
     Theme, language and search live only in those two places, so scoping the bar
     to 880 left 880-1180px with no way to reach any of them. */
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;
    padding:10px 44px;background:var(--bg);border-bottom:1px solid var(--border)}
  .mtop .wordmark-txt{font-size:20px}
  .mtop-sp{margin-left:auto;display:flex;gap:7px}
  .msrch{display:block;padding:10px 44px 0}
  .msrch[hidden]{display:none}
  .msrch .srch{padding:0}
  .msrch .srch svg{left:11px}
  /* the section bar now stacks under a 61px sticky top bar */
  .secbar{top:61px}
}

/* ---- single column ---- */
@media (max-width:880px){
  .paper{border-left:none;min-height:0}
  /* section bar parks under the mobile top bar and stays reachable.
     61px = 40px button + 10px padding x2 + 1px border. Was 51px, which was
     computed against the old 34px button and left a 10px overlap. */
  .secbar{padding:0 20px}
  .sitem{margin-right:22px;padding:10px 0 9px}
  .sitem-n{font-size:17px}
  .masthead{padding:14px 20px 0}
  .sec,.lead,.std,.brf,.brief-head,.paper-foot,.empty,.m-idx,.m-thru{padding-left:20px;padding-right:20px}
  /* 34px, not 40: on a 360px screen the top bar already carries the wordmark,
     so this is the second time the name appears in the first viewport */
  .mh-name{font-size:34px}
  .lead{grid-template-columns:minmax(0,1fr);gap:0}
  .ord{font-size:30px;margin-bottom:2px}
  .lead-h{font-size:25px}
  .brf{grid-template-columns:minmax(0,1fr);gap:3px}
  .brf-m{white-space:normal}
  .paper-foot{padding-bottom:40px}
  /* narrower gutters at phone width; the bar itself is already on from 1180 */
  .mtop{padding:10px 20px}
  .msrch{padding:10px 20px 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"

/* Tag vocabulary — mirrors config/tags.yaml. Labels are display-only; the slug
   is what the feed is filtered on, so index counts and results cannot disagree. */
const TAG_LABEL = {
  "model-release":{zh:"模型发布", en:"Model releases"},
  "inference":{zh:"推理", en:"Inference"},
  "open-source":{zh:"开源", en:"Open source"},
  "agent":{zh:"智能体", en:"Agents"},

  "china":{zh:"中国", en:"China"},
};
/* Mon 08-17, Tue 08-18 (today). Day index is derived from the timestamp so the
   day-strip counts can never drift out of sync with the list. */
const DATE_OF_DAY = {1:"08-17", 2:"08-18"};
const dayOf = it => it.t.startsWith("08-18") ? 2 : 1;
/* No SOURCES constant. It was a hardcoded 24 while the (now dropped) tagline
   claimed 35 — two invented numbers contradicting each other on one screen, and
   neither matched the repo's config/sources.yaml (33 enabled entries). The footer
   now counts distinct sources in whatever is on screen; see renderFeedInner. */

const $ = s => document.querySelector(s);
const state = {
  lang: localStorage.getItem("fg-lang") || "zh",
  theme: localStorage.getItem("fg-theme") || "light",
  tab: localStorage.getItem("fg-tab") || "tech",
  day: 0,       // 0 = whole issue
  tag: "",      // slug from the rail index
  q: "",
};
let t = T[state.lang];

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function ico(id,cls){return `<svg class="${cls||''}"><use href="#${id}"/></svg>`}
function ord(n){return String(n).padStart(2,"0")}
function txt(it){return it[state.lang] || it.en}

/* source first: it is what a reader weighs before deciding to open something.
   The timestamp is context, so it follows. */
function metaLine(it){
  const bits = [it.src, it.t];
  if(it.pts) bits.push(`${it.pts} ${t.pts}`);
  if(it.cmt) bits.push(`${it.cmt} ${t.cmt}`);
  return bits.join(" · ");
}

function matches(it, opt){
  if(state.day && dayOf(it) !== state.day) return false;
  if(!(opt && opt.skipTag) && state.tag && !it.tags.includes(state.tag)) return false;
  if(!state.q) return true;
  const q = state.q.toLowerCase();
  const c = txt(it);
  return (c.h + " " + (c.d||"") + " " + it.src + " " + it.tags.join(" ")).toLowerCase().includes(q);
}
function tagName(slug){
  const l = TAG_LABEL[slug];
  return l ? (l[state.lang] || l.en) : slug;
}
function clearAll(){
  state.q = ""; state.day = 0; state.tag = "";
  $("#d-search").value = ""; $("#m-search").value = "";
  renderDays(); renderFeed();
}

/* ---------- active filter bar ---------- */
function renderFbar(){
  const chips = [];
  if(state.tag) chips.push({k:"tag", lab:tagName(state.tag)});
  if(state.day) chips.push({k:"day", lab:`${t.days[state.day-1]} ${DATE_OF_DAY[state.day]||""}`.trim()});
  if(state.q)   chips.push({k:"q",   lab:`${t.kw}: ${state.q}`});
  const mount = $("#fbar-mount");
  if(!chips.length){ mount.innerHTML = ""; return; }
  mount.innerHTML = `<div class="fbar">
    <span class="rail-label">${esc(t.filtering)}</span>
    ${chips.map(c=>`<button class="fchip" data-k="${c.k}">
      <span>${esc(c.lab)}</span>${ico("i-close")}</button>`).join("")}
    <button class="fclear">${esc(t.clearAll)}</button></div>`;
  mount.querySelectorAll(".fchip").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if(k === "tag") state.tag = "";
    if(k === "day") state.day = 0;
    if(k === "q"){ state.q = ""; $("#d-search").value = ""; $("#m-search").value = ""; }
    renderDays(); renderFeed();
  });
  mount.querySelector(".fclear").onclick = clearAll;
}

/* ---------- item tiers ---------- */
/* every item carries an anchor id so the contents column can jump to it */
/* Tag buttons sit OUTSIDE the <a>, not inside it. A <button> nested in an <a>
   is invalid HTML and leaves the tag unreachable by keyboard in some engines.
   The headline link and the tag filters are two separate targets now. */
function leadHTML(it, i){
  const c = txt(it);
  const tags = it.tags.length
    ? `<div class="tags">${it.tags.map(s=>`<button type="button" class="tag${state.tag===s?" is-on":""}"
        data-slug="${esc(s)}" aria-pressed="${state.tag===s}">${esc(tagName(s))}</button>`).join("")}</div>`
    : "";
  return `<article class="it" id="it-${i}" data-od-id="lead-item">
    <div class="lead">
      <span class="ord" aria-hidden="true">${ord(i)}</span>
      <div>
        <span class="meta">${esc(metaLine(it))}</span>
        <h2 class="lead-h"><a class="it-a" href="${esc(it.url||"#")}">${esc(c.h)}</a></h2>
        ${c.d ? `<p class="lead-deck">${esc(c.d)}</p>` : ""}
        ${tags ? `<div class="lead-foot">${tags}</div>` : ""}
      </div>
    </div></article>`;
}
function stdHTML(it, i){
  const c = txt(it);
  return `<article class="it" id="it-${i}">
    <div class="std">
      <h2 class="std-h"><a class="it-a" href="${esc(it.url||"#")}">${esc(c.h)}</a></h2>
      <div class="std-m meta">${esc(metaLine(it))}</div>
    </div></article>`;
}
function brfHTML(it, i){
  const c = txt(it);
  return `<article class="it is-brf" id="it-${i}">
    <div class="brf">
      <h2 class="brf-h"><a class="it-a" href="${esc(it.url||"#")}">${esc(c.h)}</a></h2>
      <span class="brf-m meta">${esc(it.src)} · ${esc(it.t.slice(6))}</span>
    </div></article>`;
}

/* ---------- states ----------
   Filtering and switching sections never reload the page, so a screen reader
   would otherwise hear nothing when the feed changes underneath it. */
function announce(n){
  const el = $("#live");
  if(el) el.textContent = n ? t.liveN(n) : t.liveNone;
}
/* Three rows is enough to read as "a list is coming" without pretending to know
   how many will arrive. aria-hidden because the live region already says it. */
function skeletonHTML(){
  return `<div class="skel" aria-hidden="true">${
    [0,1,2].map(()=>`<div class="skel-it">
      <span class="skel-l" style="width:34%"></span>
      <span class="skel-l skel-h1"></span>
      <span class="skel-l" style="width:72%"></span>
    </div>`).join("")}</div>`;
}
function errorHTML(){
  return `<div class="empty" role="alert">
    <p class="empty-t">${esc(t.errT)}</p>
    <p class="empty-d">${esc(t.errD)}</p>
    <button class="empty-b" id="retry-b">${esc(t.errB)}</button></div>`;
}

/* ---------- feed ---------- */
function renderFeed(){
  const feed = $("#feed");
  /* A render that throws used to leave the last section's items on screen, so the
     page looked fine while showing the wrong thing. Now it fails visibly. */
  try{
    renderFeedInner(feed);
  }catch(err){
    console.error(err);
    feed.innerHTML = errorHTML();
    $("#retry-b").onclick = () => renderFeed();
    $("#live").textContent = t.errT;
  }
}

function renderFeedInner(feed){
  const all = DATA[state.tab].filter(it => matches(it));
  renderFbar();

  $("#sec-h").textContent = t[state.tab + "H"];
  $("#sec-n").textContent = `${all.length} ${t.items}`;
  $("#sec-note").textContent = t.srcNote;
  announce(all.length);

  if(!all.length){
    feed.innerHTML = `<div class="empty">
      <p class="empty-t">${esc(t.emptyT)}</p>
      <p class="empty-d">${esc(t.emptyD)}</p>
      <button class="empty-b" id="clear-b">${esc(t.emptyB)}</button></div>`;
    $("#clear-b").onclick = clearAll;
    $("#foot-stat").textContent = `0 ${t.items}`;
    $("#foot-upd").textContent = t.upd;
    return;
  }

  const leads = all.filter(x=>x.tier==="lead"), stds = all.filter(x=>x.tier==="std"),
        brfs = all.filter(x=>x.tier==="brf");
  let html = "", n = 0;
  leads.forEach(it => html += leadHTML(it, ++n));
  stds.forEach(it  => html += stdHTML(it, ++n));
  if(brfs.length){
    html += `<div class="brief-head"><span class="rail-label">${esc(t.briefs)}</span><span class="hr"></span></div>`;
    brfs.forEach(it => html += brfHTML(it, ++n));
  }
  feed.innerHTML = html;

  /* a tag in the centre sets the same filter the rail row sets */
  feed.querySelectorAll(".tag").forEach(b => b.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    const s = b.dataset.slug;
    state.tag = state.tag === s ? "" : s;
    renderFeed();
  });

  /* Always derived from what is on screen. The unfiltered branch used to fall back
     to a global SOURCES total, so the footer read "8 items · 13 sources" — the 8
     was this section, the 13 was all three. Two scopes in one sentence. */
  const srcs = new Set(all.map(x => x.src)).size;
  $("#foot-stat").textContent = state.lang === "zh"
    ? `${all.length} ${t.statA}${srcs} ${t.statB}`
    : `${all.length}${t.statA}${srcs}${t.statB}`;
  $("#foot-upd").textContent = t.upd;
}

/* ---------- section bar / days / contents ---------- */
function renderSecbar(){
  $("#secbar").innerHTML = TABS.map(x=>`
    <button class="sitem" data-tab="${x.id}" aria-current="${x.id===state.tab}">
      <span class="sitem-n">${esc(t[x.id])}</span>
      <span class="sitem-c">${DATA[x.id].length}</span>
    </button>`).join("");
  $("#secbar").querySelectorAll(".sitem").forEach(b =>
    b.onclick = () => setTab(b.dataset.tab));
}

function renderDays(){
  const counts = {};
  DATA[state.tab].forEach(it => { const d = dayOf(it); counts[d] = (counts[d]||0) + 1; });
  const html = [1,2,3,4,5,6,7].map(d=>{
    const n = counts[d] || 0;
    const date = DATE_OF_DAY[d];
    return `<button class="day" data-day="${d}" aria-pressed="${state.day===d}" ${n?"":"disabled"}>
      <span class="day-d">${esc(t.days[d-1])}${date?` <span class="day-dt">${date}</span>`:""}</span>
      <span class="day-n">${n||"—"}</span></button>`;
  }).join("");
  ["#day-list","#day-list-m"].forEach(sel=>{
    const el = $(sel); el.innerHTML = html;
    el.querySelectorAll(".day").forEach(b => b.onclick = () => {
      const d = +b.dataset.day;
      state.day = state.day === d ? 0 : d;
      renderDays(); renderFeed();
    });
  });
}

/* The rail answers two questions the centre column structurally cannot:
   "why does this week hang together" and "what's in the sections I'm not reading". */
/* The rail carries exactly one thing the centre structurally cannot: the read on
   why this section's items hang together. An "other sections" list used to sit
   below it, but renderSecbar already lists all three sections with counts and
   handles switching — same function, two entry points, and the weaker one was
   taking a third of the rail. Removed. */
function renderRail(){
  const html = `
    <div class="idx-head">
      <h2 class="idx-h">${esc(t.thruH)}</h2>
      <span class="rail-label">${esc(t[state.tab])}</span>
    </div>
    <p class="thru">${t["thru_" + state.tab]}</p>
    <span class="thru-sig">${esc(t.thruSig(DATA[state.tab].length))}</span>`;
  ["#idx-desktop","#idx-mobile"].forEach(sel=>{
    const el = $(sel); el.innerHTML = html;
  });
}

/* ---------- language / theme / tab ---------- */
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const v = t[el.dataset.i18n]; if(v != null) el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{
    const v = t[el.dataset.i18nPh]; if(v != null){ el.placeholder = v; el.setAttribute("aria-label", v); }
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{
    const v = t[el.dataset.i18nAria]; if(v != null){ el.setAttribute("aria-label", v); el.title = v; }
  });
  /* label only — a title on a container would fire a tooltip across the whole bar */
  document.querySelectorAll("[data-i18n-label]").forEach(el=>{
    const v = t[el.dataset.i18nLabel]; if(v != null) el.setAttribute("aria-label", v);
  });
  $("#mh-issue").textContent = t.issue;
  $("#d-lang-lab").textContent = state.lang === "zh" ? "中文" : "EN";
  $("#m-lang").querySelector(".tbtn-lab").textContent = state.lang === "zh" ? "中" : "EN";
  $("#ck-zh").hidden = state.lang !== "zh";
  $("#ck-en").hidden = state.lang !== "en";
}

/* the rail is issue-level editorial, so it does not re-render on every keystroke —
   only when the section or the language changes */
function renderAll(){ renderSecbar(); renderDays(); renderRail(); renderFeed(); }

function setLang(l){
  state.lang = l; t = T[l];
  localStorage.setItem("fg-lang", l);
  document.documentElement.lang = l === "zh" ? "zh-Hans" : "en";
  applyI18n(); renderAll();
}
function setTheme(th){
  state.theme = th;
  localStorage.setItem("fg-theme", th);
  document.documentElement.dataset.theme = th;
  const id = th === "dark" ? "#i-sun" : "#i-moon";
  ["#d-theme","#m-theme"].forEach(s =>
    $(s).querySelector("use").setAttribute("href", id));
}
function setTab(id){
  state.tab = id; state.day = 0; state.tag = "";
  localStorage.setItem("fg-tab", id);
  document.querySelectorAll(".sitem").forEach(b =>
    b.setAttribute("aria-current", b.dataset.tab === id));
  renderDays(); renderRail(); renderFeed();
  window.scrollTo({top:0});
}

/* ---------- wiring ---------- */
["#d-theme","#m-theme"].forEach(s =>
  $(s).onclick = () => setTheme(state.theme === "dark" ? "light" : "dark"));

/* The menu was mouse-only: no Escape, no arrow keys, and focus was left inside a
   hidden container after choosing — which strands keyboard users. */
const langItems = () => [...$("#langpop").querySelectorAll("[data-lang]")];
function setLangMenu(open, focusItem){
  $("#langpop").hidden = !open;
  $("#d-lang").setAttribute("aria-expanded", String(open));
  if(open && focusItem !== false) langItems()[0].focus();
  /* focus must come back to the trigger, or the tab order restarts at the top */
  if(!open && focusItem !== false) $("#d-lang").focus();
}
$("#d-lang").onclick = e => {
  e.stopPropagation();
  setLangMenu($("#langpop").hidden, false);
};
$("#d-lang").onkeydown = e => {
  if(e.key === "ArrowDown" || e.key === "Enter" || e.key === " "){
    e.preventDefault(); setLangMenu(true);
  }
};
$("#langpop").onkeydown = e => {
  const items = langItems(), i = items.indexOf(document.activeElement);
  if(e.key === "Escape"){ e.preventDefault(); setLangMenu(false); }
  else if(e.key === "ArrowDown"){ e.preventDefault(); items[(i+1) % items.length].focus(); }
  else if(e.key === "ArrowUp"){ e.preventDefault(); items[(i-1+items.length) % items.length].focus(); }
  else if(e.key === "Home"){ e.preventDefault(); items[0].focus(); }
  else if(e.key === "End"){ e.preventDefault(); items[items.length-1].focus(); }
  else if(e.key === "Tab"){ setLangMenu(false, false); }
};
document.addEventListener("click", e => {
  if(!e.target.closest(".langmenu") && !$("#langpop").hidden) setLangMenu(false, false);
});
$("#langpop").querySelectorAll("[data-lang]").forEach(b => b.onclick = () => {
  setLang(b.dataset.lang);
  setLangMenu(false);
});
$("#m-lang").onclick = () => setLang(state.lang === "zh" ? "en" : "zh");

$("#m-search-btn").onclick = () => {
  const w = $("#m-search-wrap"), open = !w.hidden;
  w.hidden = open; $("#m-search-btn").setAttribute("aria-expanded", String(!open));
  if(!open) $("#m-search").focus();
};
["#d-search","#m-search"].forEach(s => $(s).oninput = e => {
  state.q = e.target.value.trim();
  const other = s === "#d-search" ? "#m-search" : "#d-search";
  $(other).value = e.target.value;
  renderFeed();
});

/* Escape closes the mobile search the same way it closes the language menu */
["#d-search","#m-search"].forEach(s => $(s).onkeydown = e => {
  if(e.key !== "Escape") return;
  if(state.q){ e.target.value = ""; state.q = ""; renderFeed(); }
  else if(s === "#m-search"){
    $("#m-search-wrap").hidden = true;
    $("#m-search-btn").setAttribute("aria-expanded","false");
    $("#m-search-btn").focus();
  }
});

/* init */
document.documentElement.lang = state.lang === "zh" ? "zh-Hans" : "en";
document.documentElement.dataset.theme = state.theme;
setTheme(state.theme);
applyI18n();

/* This deck ships its data inline, so there is no fetch to be slow or to fail.
   Rather than fake a delay on every load, the states are reachable on demand:
   ?state=loading and ?state=error. The error path is also wired for real — any
   throw inside renderFeed lands there (see renderFeed's catch). */
const forced = new URLSearchParams(location.search).get("state");
if(forced === "loading"){
  renderSecbar(); renderDays(); renderRail();
  $("#feed").innerHTML = skeletonHTML();
  $("#live").textContent = t.loading;
}else if(forced === "error"){
  renderSecbar(); renderDays(); renderRail();
  $("#feed").innerHTML = errorHTML();
  $("#retry-b").onclick = () => { history.replaceState(null,"",location.pathname); renderAll(); };
  $("#live").textContent = t.errT;
}else{
  renderAll();
}
</script>
</body>
</html>
